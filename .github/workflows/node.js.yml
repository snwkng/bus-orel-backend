# CI: проверки (lint, unit-тесты, build) на GitHub-hosted раннере,
# деплой (pm2 на VPS) — на self-hosted раннере, только после успешных проверок.

name: bus-orel-backend

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Lint
      run: npx eslint .
    - name: Unit tests
      run: npm run test
    - name: Build
      run: npm run build --if-present

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: checks
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22]
    env:
      MONGODB_HOST: ${{secrets.MONGODB_HOST}}
      MONGODB_PORT: ${{secrets.MONGODB_PORT}}
      PORT: ${{secrets.PORT}}

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Create .env file
      run: |
        touch .env
        echo "MONGODB_HOST=${{secrets.MONGODB_HOST}}" >> .env
        echo "MONGODB_PORT=${{secrets.MONGODB_PORT}}" >> .env
        echo "MONGODB_DATABASE_NAME=${{secrets.MONGODB_DATABASE_NAME}}" >> .env
        echo "MONGODB_USERNAME=${{secrets.MONGODB_USERNAME}}" >> .env
        echo "MONGODB_PASSWORD=${{secrets.MONGODB_PASSWORD}}" >> .env
        echo "PORT=${{secrets.PORT}}" >> .env
        echo "JWT_SECRET=${{secrets.JWT_SECRET}}" >> .env
        echo "JWT_EXPIRE_IN=${{secrets.JWT_EXPIRE_IN}}" >> .env
        echo "JWT_REFRESH_SECRET=${{secrets.JWT_REFRESH_SECRET}}" >> .env
        echo "JWT_REFRESH_EXPIRE_IN=${{secrets.JWT_REFRESH_EXPIRE_IN}}" >> .env
        echo "SITE_HOST=${{secrets.SITE_HOST}}" >> .env
        echo "ALLOWED_ORIGINS=${{secrets.ALLOWED_ORIGINS}}" >> .env
        echo "AWS_ACCESS_KEY=${{secrets.AWS_ACCESS_KEY}}" >> .env
        echo "AWS_SECRET_KEY=${{secrets.AWS_SECRET_KEY}}" >> .env
        echo "AWS_S3_REGION=${{secrets.AWS_S3_REGION}}" >> .env
        echo "AWS_S3_ENDPOINT=${{secrets.AWS_S3_ENDPOINT}}" >> .env
        echo "AWS_S3_BUCKET=${{secrets.AWS_S3_BUCKET}}" >> .env
        echo "NODE_ENV=${{secrets.NODE_ENV}}" >> .env
    - run: npm ci
    - run: npm run build --if-present
    - run: pm2 restart backend
