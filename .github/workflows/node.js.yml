# CI: проверки (lint, unit-тесты, e2e, build) на GitHub-hosted раннере,
# образ — сборка и пуш в GHCR на GitHub-hosted раннере,
# деплой (docker compose pull + up на VPS) — на self-hosted раннере, только после успешных проверок и сборки.

name: bus-orel-backend

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  # ручной запуск (Actions → Run workflow на master) — например, чтобы пересобрать .env из секретов без пуша
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Lint
      run: npx eslint .
    - name: Unit tests
      run: npm run test
    - name: E2E tests
      run: npm run test:e2e
    - name: Build
      run: npm run build --if-present

  build-image:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./dockerfile
        push: true
        tags: |
          ghcr.io/snwkng/bus-orel-backend:latest
          ghcr.io/snwkng/bus-orel-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: build-image
    runs-on: self-hosted
    permissions:
      packages: read
    concurrency:
      group: deploy-backend
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
    - name: Sync app dir
      run: |
        mkdir -p ~/apps/backend
        cp docker-compose.prod.yml ~/apps/backend/docker-compose.yml
    - name: Create .env file
      run: |
        ENV=~/apps/backend/.env
        : > "$ENV"
        echo "MONGODB_HOST=${{secrets.MONGODB_HOST}}" >> "$ENV"
        echo "MONGODB_PORT=${{secrets.MONGODB_PORT}}" >> "$ENV"
        echo "MONGODB_DATABASE_NAME=${{secrets.MONGODB_DATABASE_NAME}}" >> "$ENV"
        echo "MONGODB_USERNAME=${{secrets.MONGODB_USERNAME}}" >> "$ENV"
        echo "MONGODB_PASSWORD=${{secrets.MONGODB_PASSWORD}}" >> "$ENV"
        echo "PORT=${{secrets.PORT}}" >> "$ENV"
        echo "JWT_SECRET=${{secrets.JWT_SECRET}}" >> "$ENV"
        echo "JWT_EXPIRE_IN=${{secrets.JWT_EXPIRE_IN}}" >> "$ENV"
        echo "JWT_REFRESH_SECRET=${{secrets.JWT_REFRESH_SECRET}}" >> "$ENV"
        echo "JWT_REFRESH_EXPIRE_IN=${{secrets.JWT_REFRESH_EXPIRE_IN}}" >> "$ENV"
        echo "ALLOWED_ORIGINS=${{secrets.ALLOWED_ORIGINS}}" >> "$ENV"
        echo "AWS_ACCESS_KEY=${{secrets.AWS_ACCESS_KEY}}" >> "$ENV"
        echo "AWS_SECRET_KEY=${{secrets.AWS_SECRET_KEY}}" >> "$ENV"
        echo "AWS_S3_REGION=${{secrets.AWS_S3_REGION}}" >> "$ENV"
        echo "AWS_S3_ENDPOINT=${{secrets.AWS_S3_ENDPOINT}}" >> "$ENV"
        echo "AWS_S3_BUCKET=${{secrets.AWS_S3_BUCKET}}" >> "$ENV"
        echo "NODE_ENV=${{secrets.NODE_ENV}}" >> "$ENV"
        chmod 600 "$ENV"
    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Deploy
      run: |
        cd ~/apps/backend
        docker compose pull
        docker compose up -d
    - name: Logout from GHCR
      if: always()
      run: docker logout ghcr.io
