# Dev-override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  nestjs-app:
    build:
      context: .
      dockerfile: dockerfile.dev
    image: backend:dev
    environment:
      NODE_ENV: development
      # polling — чтобы tsc --watch видел изменения через bind-mount на Windows
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    volumes:
      - ./src:/app/src:ro
  app-db:
    # на хосте 27017 занят локальной MongoDB — пробрасываем на 27018
    ports: !override
      - "127.0.0.1:27018:27017"
